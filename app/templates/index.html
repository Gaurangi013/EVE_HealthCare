<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVE Healthcare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand">EVE Healthcare</div>
          <span class="tag">API demo</span>
        </div>
        <div class="user-pill" id="user-pill">Not signed in</div>
      </header>

      <main class="dashboard">
        <section class="panel auth-panel">
          <div class="panel-header">
            <h2>Authentication</h2>
          </div>
          <div class="auth-grid">
            <form id="signup-form" class="stacked-form">
              <h3>Sign Up</h3>
              <input type="email" id="signup-email" placeholder="Email" required />
              <input type="password" id="signup-password" placeholder="Password" required />
              <select id="signup-role">
                <option value="patient">Patient</option>
                <option value="admin">Admin</option>
              </select>
              <button type="submit">Create account</button>
            </form>

            <form id="login-form" class="stacked-form">
              <h3>Login</h3>
              <input type="email" id="login-email" placeholder="Email" required />
              <input type="password" id="login-password" placeholder="Password" required />
              <button type="submit">Login</button>
            </form>
          </div>
          <div class="token-box hidden" id="token-box">
            <label>JWT Token</label>
            <textarea id="token-output" readonly rows="3"></textarea>
          </div>
        </section>

        <section class="panel operations-panel">
          <div class="panel-header">
            <h2>Operations</h2>
          </div>
          <div class="operations-grid">
            <form id="centre-form" class="stacked-form">
              <h3>Add Centre</h3>
              <input type="text" id="centre-name" placeholder="Centre name" required />
              <input type="text" id="centre-location" placeholder="Location" required />
              <button type="submit">Create centre</button>
            </form>

            <form id="test-form" class="stacked-form">
              <h3>Add Test</h3>
              <input type="number" id="test-centre-id" placeholder="Centre ID" required />
              <input type="text" id="test-name" placeholder="Test name" required />
              <input type="number" step="0.01" id="test-price" placeholder="Price" required />
              <button type="submit">Create test</button>
            </form>

            <form id="booking-form" class="stacked-form">
              <h3>Create Booking</h3>
              <input type="text" id="booking-patient" placeholder="Patient name" required />
              <input type="number" id="booking-centre-id" placeholder="Centre ID" required />
              <input type="number" id="booking-test-id" placeholder="Test ID" required />
              <input type="datetime-local" id="booking-datetime" required />
              <button type="submit">Book appointment</button>
            </form>

            <form id="payment-form" class="stacked-form">
              <h3>Webhook Payment</h3>
              <input type="number" id="payment-booking-id" placeholder="Booking ID" required />
              <input type="text" id="payment-event-id" placeholder="Provider event ID" required />
              <select id="payment-status">
                <option value="SUCCESS">SUCCESS</option>
                <option value="FAILED">FAILED</option>
              </select>
              <button type="submit">Send webhook</button>
            </form>
          </div>
        </section>

        <section class="panel list-panel">
          <div class="panel-header">
            <h2>Data</h2>
            <button class="secondary-btn" id="load-centres">Refresh</button>
          </div>
          <div class="data-grid">
            <div class="list-card">
              <h3>Centres</h3>
              <ul id="centres-list"></ul>
            </div>
            <div class="list-card">
              <h3>Bookings</h3>
              <ul id="bookings-list"></ul>
            </div>
          </div>
        </section>
      </main>

      <div id="message-box" class="message-box hidden"></div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
